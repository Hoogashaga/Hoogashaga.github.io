- title: Autonomous Robot Car — Vision-Based Sign Recognition, Obstacle Avoidance, Optimal Path Planning and IoT Connectivity
  year: "Sep–Nov 2024"
  summary: |
    A self-driving robot car built from the circuit board up, then turned into a
    connected device with a cloud back end.

    - **Control board.** Designed the schematic, PCB layout and Gerber files for
      the motor drivers, ultrasonic range sensor, infrared line sensors and wheel
      encoders.
    - **Vision.** A camera pipeline with a custom-trained lightweight model
      recognises traffic lights, stop and turn signs, pedestrians, cyclists and
      cones, and triggers the matching manoeuvre: stop, yield, turn or swerve.
    - **Mapping and planning.** Ultrasonic sweeps become a 2D occupancy map with
      noise filtering and gap detection; A\* finds the optimal route, and a
      background sensor thread halts the car, marks new obstacles and re-plans in
      real time. Live detections stream to a browser dashboard.
    - **Remote control.** The car can be driven from a laptop. A multi-threaded
      server on the Pi takes commands over TCP, streams the camera as MJPEG and
      reports distance, line sensors and speed as JSON, with an Electron console
      on the other end. A Bluetooth RFCOMM version keeps control working without
      Wi-Fi, over a 1 Mbps link.
    - **Network security.** Locked the Pi down with a firewall, mapped Wi-Fi
      dead zones by driving the car around the house, and inspected the car's
      own traffic in Wireshark, including decrypting its TLS sessions to see the
      HTTP/2 requests underneath.
    - **Cloud fleet.** Scaled from one car to a fleet of emulated vehicles
      reporting emissions to AWS IoT Core over MQTT, each with its own
      certificate. A Lambda tracks every vehicle's peak CO₂ and answers each car
      on its own topic, the full stream is archived to S3 and queried with SQL
      through Athena, and Device Defender catches a simulated message flood.
  tags: [Computer Vision, Path Planning, A*, Obstacle Avoidance, Embedded Systems, PCB Design, Python, OpenCV, Raspberry Pi, TCP/IP, MQTT, AWS IoT, Wireshark, Electron]
  image: ""
  # 圖片集：點縮圖會開原圖
  images:
    - src: img/picar-schematic.png
      caption: Control board schematic
    - src: img/picar-pcb.png
      caption: PCB layout
    - src: img/picar-gerber.png
      caption: Gerber view
    - src: img/picar-wifi-console.png
      caption: Electron console driving the car over Wi-Fi, with live camera feed and telemetry
    - src: img/picar-cloud-trajectories.png
      caption: Vehicle trajectories queried from the S3 archive through Athena
  # 示範影片：每支 {src, poster, caption}
  videos:
