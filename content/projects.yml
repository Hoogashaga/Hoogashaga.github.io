- title: Clinical Question Answering over Electronic Health Records — Uncertainty-Aware Text-to-Program with T5
  year: "2025"
  summary: >
    A question-answering system that lets clinicians query structured electronic
    health records (MIMIC-III) in plain English. A fine-tuned T5 model translates
    each question into an executable program that runs against a knowledge graph
    built from the records, so answers are computed rather than guessed. The model
    is trained without any hand-written programs, using synthetic question–program
    pairs and pseudo-labelling. An ensemble of five models decomposes prediction
    uncertainty into data and model components to flag ambiguous or ill-posed
    questions before they yield a wrong answer. Reproduced the published results —
    execution accuracy 0.945 vs. 0.948 reported, high-ambiguity detection AUROC
    0.80 vs. 0.80 — after rebuilding the full data pipeline from raw MIMIC-III CSVs
    to a SPARQL knowledge graph, porting the legacy codebase to current PyTorch
    Lightning and Hugging Face, adding checkpoint resumption, and running
    hyperparameter and ensemble-size studies on A100 GPUs.
  tags: [Clinical NLP, Text-to-Program, T5, Uncertainty Estimation, Knowledge Graph, PyTorch Lightning, Hugging Face]
  image: ""
  images:
    - src: img/ehr-qa-validation-accuracy.png
      caption: Validation execution accuracy across ensemble models
    - src: img/ehr-qa-ambiguity-detection.png
      caption: Ambiguity detection (AUROC / AUPRC) by uncertainty measure
    - src: img/ehr-qa-ensemble-size.png
      caption: Execution accuracy vs. ensemble size
  links:
    - label: Code
      url: https://github.com/Hoogashaga/text2program-on-mimic-reimplementation
  featured: true

