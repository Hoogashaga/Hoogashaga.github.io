#   title     專案名稱
#   year      右側顯示，自由文字（"2024"、"2023–24"）
#   summary   一到三句，可用 Markdown。一行裡有「: 」的話要用 > 區塊寫法
#   tags      關鍵字，會顯示成小標籤
#   image     "img/<檔名>"，縮圖，先把圖放進 static/img/。留空就沒有圖
#   video     示範影片，兩種寫法擇一：
#               files/demo.mp4            自架檔案，放進 static/files/（建議 10MB 以內）
