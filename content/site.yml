# About me：Markdown，幾段短文即可。
# ---------------------------------------------------------------------------
about: |
  **I'm Orion**, an engineer who is happiest when a new technology shows up
  and I get to find out how it really works. That curiosity has carried me
  from physics and photonics through VR/AR optics, computer vision and
  robotics to machine learning and large language models, and each time the
  pattern is the same: learn the principles, build something real, and test
  whether it holds up.

  Along the way I've built optical analysis systems for the HTC Vive tracking
  system, machine-vision tooling at Tesla, a self-driving robot car from the
  circuit board up, and retrieval systems and fine-tuned language models. My
  current research at Georgia Tech looks at memory in LLM
  agents: I designed a self-repair framework and the evaluation methods to
  probe where retrieval breaks down and what repair can and cannot fix
  (manuscript under review at *IEEE OJCS*).

  What I enjoy most is the space where research meets engineering: trying a
  new approach, building the system around it, and understanding exactly why
  it succeeds or fails. Hardware taught me that a result only counts when it
  runs outside the lab; research taught me to design the experiment that
  could prove me wrong. I remain curious about emerging technologies across
  disciplines, and I'm particularly drawn to ML systems for the research
  challenges and the opportunities to build something new.

