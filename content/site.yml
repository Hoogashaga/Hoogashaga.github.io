# About me：Markdown，幾段短文即可。
# ---------------------------------------------------------------------------
about: |
  I'm Orion, an engineer who can't resist taking things apart to see how they
  work, from laser optics to language models. Over the years that curiosity has
  taken me through VR tracking optics for the HTC Vive, AR display systems,
  machine-vision tooling at Tesla and Intel, a self-driving robot car built from
  the circuit board up, and most recently LLM agents that check and repair their
  own memory. The thread running through all of it: understand the system,
  then make it work reliably.

  Today my focus is making LLM agents trustworthy: detecting when a model is
  uncertain, repairing failures in its memory, and measuring the result with
  evidence-based evaluation. My latest work is a self-repair framework for
  multi-graph agent memory, evaluated on the LoCoMo benchmark (under review at
  *IEEE OJCS*). Before that I fine-tuned and ensembled T5 models for
  text-to-program question answering over clinical records, reproducing the
  published results end to end.

  My background in physics and photonics taught me to treat ML as an empirical
  science: careful experiments, engineering rigor, reliable operation. I pick
  up new domains quickly, and I'm happiest on teams where research and
  engineering sit side by side, building AI that is safer and more trustworthy.

